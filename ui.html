<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#16181d;--bar:#f4f5f7;--line:#e1e4e8;--ink:#1d2330;--mut:#667085;--acc:#3b5bfd;--accd:#2f49d1}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);user-select:none;overflow:hidden}

  #top{display:flex;align-items:flex-end;height:38px;padding:6px 8px 0}
  #tabs{display:flex;align-items:flex-end;gap:3px;min-width:0}
  .tab{height:32px;padding:0 8px 0 14px;display:flex;align-items:center;gap:8px;border-radius:9px 9px 0 0;color:#aab0bd;cursor:pointer;transition:background .12s,color .12s}
  .tab:hover{background:#23262e;color:#fff}
  .tab.on{background:var(--bar);color:var(--ink);font-weight:600}
  .tab input{width:70px;height:22px;border:1px solid #c5cad3;border-radius:6px;padding:0 6px;font:inherit}
  .x{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:13px;opacity:.5}
  .x:hover{opacity:1;background:#e5484d;color:#fff}
  #plus{width:30px;height:30px;margin-bottom:1px;border-radius:8px;display:grid;place-items:center;color:#aab0bd;font-size:18px;cursor:pointer}
  #plus:hover{background:#23262e;color:#fff}
  #gd{margin-left:auto;align-self:center;padding:0 6px 4px 12px;color:#9aa3b2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}

  .bar{height:46px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px}
  .ib{width:32px;height:32px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:#475467;flex:none}
  .ib:hover{background:#e6e9ef;color:var(--ink)}
  .ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #url{flex:1;min-width:120px;height:32px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;padding:0 12px;font:inherit;color:var(--ink);outline:none}
  #url:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,91,253,.15)}
  .btn{height:32px;padding:0 12px;border:1px solid #d0d5dd;background:#fff;border-radius:8px;font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
  .btn:hover{background:#eef0f4}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn.pri:hover{background:var(--accd)}
  .btn:disabled{opacity:.6;cursor:default}
  .zoom{display:flex;align-items:center;height:32px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;overflow:hidden;flex:none}
  .zoom button{width:28px;height:30px;border:0;background:transparent;color:#475467;font-size:15px;cursor:pointer}
  .zoom button:hover{background:#eef0f4;color:var(--ink)}
  #pc{min-width:48px;text-align:center;cursor:pointer;font-size:12px;color:var(--ink);padding:0 2px}
  #pc:hover{color:var(--acc)}
  .zoom #zhepsi{width:auto;padding:0 8px;font-size:11px;color:var(--mut);border-left:1px solid #e4e7ec}
  .ayrac{width:1px;height:20px;background:#d0d5dd;margin:0 4px;flex:none}
</style>
</head>
<body>
<div id="top">
  <div id="tabs"></div>
  <span id="gd"></span>
</div>
<div class="bar">
  <button class="ib" id="yenile" title="Yenile">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
  <input id="url" type="text" placeholder="Adres yaz, Enter" spellcheck="false">
  <button class="btn" id="git">Git</button>
  <button class="btn" id="hepsi" title="Bu adresi tüm sekmelerde aç">Hepsinde aç</button>
  <span class="ayrac"></span>
  <div class="zoom">
    <button id="zeksi" title="Küçült">−</button>
    <span id="pc" title="100% yap">100%</span>
    <button id="zarti" title="Büyüt">+</button>
    <button id="zhepsi" title="Bu zoom'u tüm sekmelere uygula">Tümü</button>
  </div>
  <span class="ayrac"></span>
  <button class="btn pri" id="simdi" title="Kayıtlı bilgilerle giriş yap">Şimdi gir</button>
  <button class="ib" id="ayarlar" title="Ayarlar">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <button class="ib" id="editor" title="Scripti düzenle">
    <svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M14 4l-4 16"/></svg>
  </button>
  <button class="ib" id="debug" title="Hata ayıklama raporu">
    <svg viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="12" rx="4"/><path d="M9 8a3 3 0 0 1 6 0"/><path d="M4 13h4M16 13h4M5 7l3 3M19 7l-3 3M5 19l3-3M19 19l-3-3"/></svg>
  </button>
</div>
<script>
let S = null, sonId = null, gdT = null;
const $ = (id) => document.getElementById(id);
const aktif = () => S && S.tabs.find((t) => t.id === S.active);

function durumYaz(m, kalici) {
  $('gd').textContent = m || '';
  clearTimeout(gdT);
  if (m && !kalici) gdT = setTimeout(() => { $('gd').textContent = ''; }, 12000);
}

api.durum((s) => { S = s; ciz(); });

function ciz() {
  const t = $('tabs'); t.innerHTML = '';
  S.tabs.forEach((tb) => {
    const d = document.createElement('div');
    d.className = 'tab' + (tb.id === S.active ? ' on' : '');
    const ad = document.createElement('span'); ad.textContent = tb.name;
    const x = document.createElement('span'); x.textContent = '×'; x.className = 'x'; x.title = 'Sekmeyi kapat';
    x.onclick = (e) => {
      e.stopPropagation();
      if (confirm('"' + tb.name + '" sekmesi kapatılsın mı?')) api.gonder('kapat', tb.id);
    };
    d.appendChild(ad); d.appendChild(x);
    d.onclick = () => { if (tb.id !== S.active) api.gonder('sec', tb.id); };
    d.ondblclick = () => {
      const i = document.createElement('input');
      i.type = 'text'; i.value = tb.name;
      ad.replaceWith(i); i.focus(); i.select();
      i.onclick = (e) => e.stopPropagation();
      i.onblur = () => api.gonder('ad', tb.id, i.value.trim() || tb.name);
      i.onkeydown = (e) => { if (e.key === 'Enter') i.blur(); };
    };
    t.appendChild(d);
  });
  const p = document.createElement('div');
  p.id = 'plus'; p.textContent = '+'; p.title = 'Yeni sekme'; p.onclick = () => api.gonder('ekle');
  t.appendChild(p);

  const a = aktif();
  if (!a) return;
  if (document.activeElement !== $('url')) $('url').value = a.url || '';
  $('pc').textContent = Math.round((a.zoom || 1) * 100) + '%';
  if (sonId !== a.id) { sonId = a.id; }
}

const git = () => { const a = aktif(); if (a) api.gonder('git', a.id, $('url').value); };
$('git').onclick = git;
$('url').onkeydown = (e) => { if (e.key === 'Enter') git(); };
$('hepsi').onclick = () => api.gonder('hepsi', $('url').value);
$('yenile').onclick = () => { const a = aktif(); if (a) api.gonder('yenile', a.id); };

$('zeksi').onclick = () => { const a = aktif(); if (a) api.gonder('zoom', a.id, -0.1); };
$('zarti').onclick = () => { const a = aktif(); if (a) api.gonder('zoom', a.id, 0.1); };
$('pc').onclick = () => { const a = aktif(); if (a) api.gonder('zoom1', a.id); };
$('zhepsi').onclick = () => { const a = aktif(); if (a) api.gonder('zoomhepsi', a.id); };

$('ayarlar').onclick = () => api.gonder('ayarlar');
$('editor').onclick = () => api.gonder('editor');
$('debug').onclick = () => api.gonder('debug');

$('simdi').onclick = async () => {
  const a = aktif(); if (!a) return;
  const b = $('simdi'); b.disabled = true;
  durumYaz('Giriş deneniyor (yaklaşık 9 sn)...', true);
  const r = await api.al('simdi', a.id);
  durumYaz(r);
  b.disabled = false;
};
</script>
</body>
</html>
