<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.3 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;color:#1d2330}
  #bar{padding:10px 12px;display:flex;gap:8px;align-items:center;background:#f4f5f7;border-bottom:1px solid #e1e4e8;flex-wrap:wrap}
  #bar button{height:32px;padding:0 12px;border:1px solid #d0d5dd;background:#fff;border-radius:8px;font:inherit;cursor:pointer;color:#1d2330}
  #bar button:hover{background:#eef0f4}
  #bar button.p{background:#3b5bfd;border-color:#3b5bfd;color:#fff;font-weight:600}
  #bar button.p:hover{background:#2f49d1}
  #not{flex:1;min-width:220px;height:32px;padding:0 10px;border:1px solid #d0d5dd;border-radius:8px;font:inherit;outline:none}
  #not:focus{border-color:#3b5bfd;box-shadow:0 0 0 3px rgba(59,91,253,.15)}
  textarea{flex:1;font:11px Consolas,monospace;white-space:pre;border:0;padding:10px;outline:none;resize:none;background:#fff}
  #d{color:#067647;font-size:12px}
</style>
</head>
<body>
<div id="bar">
  <input id="not" type="text" placeholder="Kısa not: ne yaptın / ne oldu (ör. ilaç ara'ya bastım, 3 dk bekledim)">
  <button id="ekle">Not ekle</button>
  <button id="yenile">Yenile</button>
  <button id="teshis" title="Giriş formundaki alan/buton listesini panoya kopyalar (parola içermez)">Giriş teşhisi</button>
  <button id="kopya" class="p">Raporu kopyala</button>
  <span id="d"></span>
</div>
<textarea id="t" readonly spellcheck="false"></textarea>
<script>
const $ = (id) => document.getElementById(id);
async function yukle() {
  $('t').value = await api.al('dbg:rapor');
  $('t').scrollTop = $('t').scrollHeight;
}
$('yenile').onclick = () => { $('d').textContent = ''; yukle(); };
$('ekle').onclick = async () => {
  const s = $('not').value.trim();
  if (!s) return;
  await api.al('dbg:not', s);
  $('not').value = '';
  $('d').textContent = 'Not eklendi.';
  yukle();
};
$('not').onkeydown = (e) => { if (e.key === 'Enter') $('ekle').click(); };
$('kopya').onclick = async () => {
  const n = await api.al('dbg:kopya');
  $('d').textContent = n + ' karakter kopyalandı, sohbete yapıştır.';
};
$('teshis').onclick = async () => {
  $('d').textContent = 'Teşhis alınıyor...';
  $('d').textContent = await api.al('teshis');
  yukle();
};
yukle();
</script>
</body>
</html>
