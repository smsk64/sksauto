<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;font:13px sans-serif;display:flex;flex-direction:column;height:100vh}
  #bar{padding:6px;display:flex;gap:6px;align-items:center;background:#eee;flex-wrap:wrap}
  #bar button{padding:4px 8px;cursor:pointer}
  #not{flex:1;min-width:220px;padding:3px 6px}
  textarea{flex:1;font:11px Consolas,monospace;white-space:pre;border:0;padding:8px;outline:none;resize:none}
  #d{color:#0a7a2f}
</style>
</head>
<body>
<div id="bar">
  <input id="not" type="text" placeholder="Kısa not: ne yaptın / ne oldu (ör. ilaç ara'ya bastım, 3 dk bekledim)">
  <button id="ekle">Not ekle</button>
  <button id="yenile">Yenile</button>
  <button id="kopya"><b>Raporu kopyala</b></button>
  <span id="d"></span>
</div>
<textarea id="t" readonly spellcheck="false"></textarea>
<script>
const $ = (id) => document.getElementById(id);
async function yukle() {
  $('t').value = await api.al('dbg:rapor');
  $('t').scrollTop = $('t').scrollHeight;
}
$('yenile').onclick = () => { $('d').textContent = ''; yukle(); };
$('ekle').onclick = async () => {
  const s = $('not').value.trim();
  if (!s) return;
  await api.al('dbg:not', s);
  $('not').value = '';
  $('d').textContent = 'Not eklendi.';
  yukle();
};
$('not').onkeydown = (e) => { if (e.key === 'Enter') $('ekle').click(); };
$('kopya').onclick = async () => {
  const n = await api.al('dbg:kopya');
  $('d').textContent = n + ' karakter kopyalandı, sohbete yapıştır.';
};
yukle();
</script>
</body>
</html>
